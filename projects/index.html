<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>projects</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
    <nav>
        <div class="left">
            <a href="/index.html">home</a>
            <a href="/blog/index.html">blog</a>
            <a href="/projects/index.html">projects</a>
        </div>
        <div class="right">
            <a href="https://discord.com/invite/xpw6Qpx7ZB" target="_blank">discord</a>
            <a href="https://github.com/cacticrown/" target="_blank">github</a>
            <a href="https://bsky.app/profile/cacticrown.bsky.social" target="_blank">bluesky</a>
        </div>
    </nav>
  <hr>

  <h1>Projects</h1>
  <ul class="index" id="all-projects"></ul>

  <script>
  fetch('/projects/projects.json')
    .then(r => r.json())
    .then(projects => {
      const list = document.getElementById('all-projects');
      projects.forEach(project => {
        const li = document.createElement('li');
        li.innerHTML = `<a href="${project.url}">${project.title}</a> <small><i>${project.description}</i> </small>`;
        list.appendChild(li);
      });
    });
  </script>
</body>
</html>
