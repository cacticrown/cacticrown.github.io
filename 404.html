<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>404 – Page Not Found</title>
  <link rel="stylesheet" href="style.css">
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
    }
    h1 {
      font-size: 3rem;
      margin: 0.5rem 0;
    }
    p {
      margin: 0.25rem 0;
    }
    a {
      color: var(--blue, #0077ff);
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>404</h1>
  <p>Page not found.</p>
  <p><a href="/">Go back home</a></p>
</body>
</html>
