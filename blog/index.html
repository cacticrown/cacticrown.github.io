<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>blog</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
    <nav>
        <div class="left">
            <a href="/index.html">home</a>
            <a href="/blog/index.html">blog</a>
            <a href="/projects/index.html">projects</a>
        </div>
        <div class="right">
            <a href="https://discord.com/invite/xpw6Qpx7ZB" target="_blank">discord</a>
            <a href="https://github.com/cacticrown/" target="_blank">github</a>
            <a href="https://bsky.app/profile/cacticrown.bsky.social" target="_blank">bluesky</a>
        </div>
    </nav>
  <hr>
  <h1>Blog</h1>
  <ul class="index" id="all-posts"></ul>

  <script>
  fetch('posts.json')
    .then(r => r.json())
    .then(posts => {
      const list = document.getElementById('all-posts');
      posts.forEach(post => {
        const li = document.createElement('li');
        li.innerHTML = `<a href="${post.url}">${post.title}</a> <small>${new Date(post.date).toLocaleDateString()}</small>`;
        list.appendChild(li);
      });
    });
  </script>
</body>
</html>
