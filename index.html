<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="icon" href="images/cacticrown.png">
    <link rel="stylesheet" href="style.css">
    <title>cacticrown's place</title>
    <meta name="description" content="">
</head>
<body>

    <nav>
        <div class="left">
            <a href="blog/index.html">blog</a>
            <a href="projects/index.html">projects</a>
        </div>
        <div class="right">
            <a href="https://discord.com/invite/xpw6Qpx7ZB" target="_blank">discord</a>
            <a href="https://github.com/cacticrown/" target="_blank">github</a>
            <a href="https://bsky.app/profile/cacticrown.bsky.social" target="_blank">bluesky</a>
        </div>
    </nav>


    <hr>

    <section id="about">
    <h1>About</h1>
    <p>
        Hi, I'm a <span id="age"></span> year old Christian from Austria.
        I spend most of my free time coding - maybe one day it'll lead to something. Who knows.
    </p>
    </section>

    <section id="blog">
        <h1>Blog</h1>
        <ul class="index" id="latest-posts"></ul>
        <p><a href="/blog/index.html">↪ More</a></p>
    </section>

    <script>
    fetch('/blog/posts.json')
    .then(r => r.json())
    .then(posts => {
        const list = document.getElementById('latest-posts');
        posts.slice(0, 4).forEach(post => {
        const li = document.createElement('li');
        li.innerHTML = `<a href="${post.url}">${post.title}</a> <small>${new Date(post.date).toLocaleDateString()}</small>`;
        list.appendChild(li);
        });
    });
    </script>

    <section id="projects">
        <h1>Projects</h1>
        <ul class="index" id="latest-projects"></ul>
        <p><a href="/projects/index.html">↪ More</a></p>
    </section>

    <script>
    fetch('/projects/projects.json')
    .then(r => r.json())
    .then(projects => {
        const list = document.getElementById('latest-projects');
        projects.slice(0, 4).forEach(project => {
        const li = document.createElement('li');
        li.innerHTML = `<a href="${project.url}">${project.title}</a> <small><i>${project.description}</i> </small>`;
        list.appendChild(li);
        });
    });
    </script>

    <hr style="margin:1.5rem 0">

    <footer style="width:fit-content; margin:auto"></footer>

    <script>
    const birthYear = 2010;
    const birthMonth = 8;
    const birthDay = 28;

    const today = new Date();
    let age = today.getFullYear() - birthYear;
    const hasHadBirthday =
        today.getMonth() + 1 > birthMonth ||
        (today.getMonth() + 1 === birthMonth && today.getDate() >= birthDay);

    if (!hasHadBirthday) age--;

    document.getElementById("age").textContent = age;
    </script>
</body>
</html>
